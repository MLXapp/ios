name: MLXiOS
options:
  bundleIdPrefix: app.mlx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: CCKXS9W488
    CODE_SIGN_STYLE: Automatic
targets:
  MLX:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mlx.ios
        PRODUCT_NAME: MLX
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Sources/MLX.entitlements
        ENABLE_PREVIEWS: YES
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: MLX
        CFBundleName: MLX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "Face ID keeps MLX locked to you on this device."
        NSHumanReadableCopyright: "© 2026 Flex UK Limited. MLX Network."
    entitlements:
      path: Sources/MLX.entitlements
      properties:
        com.apple.developer.associated-domains: ["webcredentials:mlx.app"]
        aps-environment: development
  MLXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MLX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mlx.ios.uitests
        TEST_TARGET_NAME: MLX
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MLX:
    build:
      targets:
        MLX: all
        MLXUITests: [test]
    test:
      targets: [MLXUITests]
